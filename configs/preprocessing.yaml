# Verified Preprocessing Parameters from CNN-Informer Paper

channels:
  expected_channels:
    - "FP1-F7"
    - "F7-T7"
    - "T7-P7"
    - "P7-O1"
    - "FP1-F3"
    - "F3-C3"
    - "C3-P3"
    - "P3-O1"
    - "FP2-F4"
    - "F4-C4"
    - "C4-P4"
    - "P4-O2"
    - "FP2-F8"
    - "F8-T8"
    - "T8-P8"
    - "P8-O2"
    - "FZ-CZ"
    - "CZ-PZ"

sampling_rate: 256  # Hz

dwt:
  wavelet: "db4"
  level: 5
  reconstruct_bands: ["cD5", "cD4", "cD3", "cA5"] # 0-32 Hz

windowing:
  duration_sec: 4
  seizure_overlap: 0.5
  non_seizure_overlap: 0.0

data:
  excluded_patients: ["chb06", "chb16"]
